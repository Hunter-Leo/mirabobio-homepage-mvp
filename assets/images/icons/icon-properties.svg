  <line x1="10" y1="24" x2="38" y2="24" stroke="#4B8DFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="10" y1="34" x2="38" y2="34" stroke="#4B8DFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  
  <!-- 滑块手柄 -->
