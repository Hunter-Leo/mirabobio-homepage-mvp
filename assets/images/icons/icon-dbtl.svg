<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-dbtl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="24" cy="24" r="20" fill="url(#grad-dbtl)"/>
  
  <!-- DBTL text: DB on top, TL on bottom -->
  <text x="24" y="22" font-size="10" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">DB</text>
  <text x="24" y="33" font-size="10" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">TL</text>
</svg>
